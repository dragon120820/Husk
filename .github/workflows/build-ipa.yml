name: Build Husk IPA

# 完整从源码构建 Husk.ipa (含我的 OsConstantsHolder 修复)
# 手动触发,或推送到 main 时触发
on:
  workflow_dispatch:
    inputs:
      skip_java_runtime:
        description: '跳过 Java 运行时构建(调试用,绕过 APEX 提取)'
        required: false
        default: 'false'
  push:
    branches: [ main ]

jobs:
  build:
    # The checked-in Husk.xcodeproj is objectVersion 77, which Xcode 15 refuses
    # ("xcodebuild: error: Unable to read project 'Husk.xcodeproj'") -- macos-14
    # ships Xcode 15.4. macos-15 ships Xcode 16.4, which reads it.
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 工具链 ----------
      - name: Install build tools (Homebrew)
        run: |
          brew install meson ninja pkg-config e2fsprogs gptfdisk qemu
          # Rust, for the on-device pairing library
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios || true
          # xcodegen, for regenerating the Xcode project -- deliberately NOT
          # installed. package_ipa.sh regenerates it when the binary is present,
          # and the project xcodegen 2.46 writes is rejected by the runner's
          # Xcode ("Unable to read project 'Husk.xcodeproj'") even though it
          # writes a 117 KB project.pbxproj. The checked-in project is the one
          # the project is actually built from and already lists every source,
          # including husk-tl-dvm-natives.c, so the else-branch is what we want.
          # brew install xcodegen
          # virglrenderer's meson build imports yaml (src/gallium/meson.build).
          # The runner's Homebrew python is externally managed, so pip needs the
          # override and --user.
          python3 -m pip install --user --break-system-packages pyyaml || \
            python3 -m pip install --user pyyaml || \
            brew install python-yaml || true
          # R8 (d8) for Husk's Java framework dex.
          #
          # storage.googleapis.com/r8-releases is the usual source but its raw/
          # path 404s now, and maven.google.com is not reliably reachable from a
          # runner. Google's Maven artifacts are mirrored by maven.aliyun.com,
          # which serves the same com.android.tools:r8 jar; try it first, then
          # the originals as fallback.
          mkdir -p "$RUNNER_TEMP/tools-dl"
          R8_VERSION="8.9.35"
          r8_urls=(
            "https://maven.aliyun.com/repository/google/com/android/tools/r8/${R8_VERSION}/r8-${R8_VERSION}.jar"
            "https://maven.google.com/com/android/tools/r8/${R8_VERSION}/r8-${R8_VERSION}.jar"
            "https://storage.googleapis.com/r8-releases/raw/main/r8.jar"
          )
          for u in "${r8_urls[@]}"; do
            if curl -fL --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/tools-dl/r8.jar" "$u"; then
              echo "r8 from $u"
              break
            fi
          done
          # The jar has to actually carry D8, not be an error page.
          if ! unzip -l "$RUNNER_TEMP/tools-dl/r8.jar" 2>/dev/null | grep -q 'com/android/tools/r8/D8.class'; then
            echo "downloaded r8.jar does not contain D8" >&2
            ls -la "$RUNNER_TEMP/tools-dl/" >&2
            exit 1
          fi
          ls -la "$RUNNER_TEMP/tools-dl/"

      - name: Locate a JDK
        id: jdk
        run: |
          # /usr/libexec/java_home is the reliable way on macOS; the runner ships
          # at least one JDK (Temurin 17/21). Fall back to a scan.
          JH="$(/usr/libexec/java_home 2>/dev/null || true)"
          if [ -z "$JH" ] || [ ! -x "$JH/bin/javac" ]; then
            for c in /Library/Java/JavaVirtualMachines/*/Contents/Home "$JAVA_HOME"; do
              if [ -x "$c/bin/javac" ]; then JH="$c"; break; fi
            done
          fi
          if [ -z "$JH" ] || [ ! -x "$JH/bin/javac" ]; then
            echo "no JDK found" >&2; exit 1
          fi
          echo "HUSK_JDK=$JH" >> "$GITHUB_ENV"
          echo "JDK: $JH"
          "$JH/bin/javac" -version

      - name: Set build environment
        run: |
          echo "HUSK_D8=$RUNNER_TEMP/tools-dl/r8.jar" >> "$GITHUB_ENV"
          echo "HUSK_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          # Windows checkouts do not carry the executable bit; make every script
          # runnable rather than special-casing the call sites.
          chmod +x scripts/*.sh src/java-framework/build.sh 2>/dev/null || true

      # ---------- 依赖源码 ----------
      - name: Fetch sources (QEMU, glib, libffi, ...)
        run: ./scripts/fetch_sources.sh

      - name: Build iOS dependencies (libffi glib pixman libucontext libslirp)
        run: ./scripts/build_ios.sh libffi glib pixman libucontext libslirp

      - name: Fix meson cross file name
        run: cp build/ios-arm64/cross-darwin.meson build/ios-arm64/cross-ios-darwin.meson

      - name: Build ANGLE (EGL/GLES over Metal)
        run: ./scripts/build_angle_ios.sh

      - name: Build libepoxy + virglrenderer
        run: |
          PKG_CONFIG_LIBDIR="$PWD/build/ios-arm64/sysroot/lib/pkgconfig:$PWD/build/ios-arm64/sysroot/share/pkgconfig" \
            ./scripts/build_gpu_ios.sh

      - name: Build QEMU
        run: ./scripts/build_ios.sh qemu

      - name: Integrate Husk sources into QEMU (includes my fix wiring)
        run: ./scripts/integrate_husk.sh

      - name: Rebuild QEMU (with Husk sources)
        run: ./scripts/build_ios.sh qemurebuild

      - name: Fetch guest kernel + firmware
        run: ./scripts/fetch_phase0_guest.sh

      - name: Build MoltenVK (Vulkan over Metal)
        run: ./scripts/build_moltenvk_ios.sh

      - name: Build on-device pairing (Rust)
        run: ./scripts/build_rppairing_ios.sh

      # ---------- Lineage 镜像与 Java 运行时 ----------
      - name: Download Lineage system image
        if: ${{ github.event.inputs.skip_java_runtime != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/lineage"
          curl -fL --retry 3 -o "$RUNNER_TEMP/lineage/vda.qcow2" \
            "https://github.com/Leviidev/Husk/releases/download/lineage-v2/$(python3 -c "import json,urllib.request;print(json.load(urllib.request.urlopen('https://github.com/Leviidev/Husk/releases/download/lineage-v2/manifest.json'))['image']['file'])")"
          ls -lh "$RUNNER_TEMP/lineage/"

      - name: Extract Android system resources (fonts, cacerts)
        if: ${{ github.event.inputs.skip_java_runtime != 'true' }}
        run: ./scripts/build_android_system.sh "$RUNNER_TEMP/lineage/vda.qcow2"

      - name: Build Java runtime from image (APEX)
        if: ${{ github.event.inputs.skip_java_runtime != 'true' }}
        run: ./scripts/build_java_runtime_from_image.sh "$RUNNER_TEMP/lineage/vda.qcow2"

      - name: Build Husk's Java framework dex
        if: ${{ github.event.inputs.skip_java_runtime != 'true' }}
        run: ./src/java-framework/build.sh "$PWD/build/java-runtime/husk-framework.dex"

      # ---------- 打包 ----------
      - name: Package IPA
        run: ./scripts/package_ipa.sh "$PWD/build/Husk.ipa"

      - name: Show IPA info
        run: ls -lh "$PWD/build/Husk.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: build/Husk.ipa
          if-no-files-found: error
          retention-days: 7
